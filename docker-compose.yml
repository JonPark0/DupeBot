# Docker Compose V2 (no top-level "version:" key needed)
services:
  dupe-bot:
    # Built by GitHub Actions (.github/workflows/image.yml) and pulled from
    # GHCR; IMAGE_TAG=sha-<commit> in the environment runs an earlier build.
    # `build` stays for working locally: `docker compose up --build`.
    image: ghcr.io/jonpark0/dupebot:${IMAGE_TAG:-main}
    build: .
    labels:
      # deployed by hand from our own builds, so Diun needn't watch it
      diun.enable: "false"
    container_name: dupebot
    restart: unless-stopped
    env_file: .env
    environment:
      # POSTGRES_PASSWORD goes into a URL here: use letters, digits, - and _ only
      DATABASE_URL: postgres://${POSTGRES_USER:-dupebot}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dupebot}
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      postgres:
        condition: service_healthy
    # The bot only makes outbound connections, no ports need to be published.
    deploy:
      resources:
        limits:
          memory: 320M

  postgres:
    # Same image as the other bots, but its own container and volume (nothing is shared).
    image: postgres:18-alpine
    container_name: dupebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dupebot}
      POSTGRES_USER: ${POSTGRES_USER:-dupebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Unicode-aware character classes, so pg_trgm also splits Korean/Japanese titles into trigrams
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=4MB"]
    volumes:
      # postgres:18+ keeps data in /var/lib/postgresql/<major>/docker and refuses to start
      # if anything is mounted at the old /var/lib/postgresql/data path.
      - dupebot-postgres:/var/lib/postgresql
    # The schema is applied by the bot on every start (database/init.sql, idempotent).
    expose:
      - "5432"
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dupebot-postgres:
